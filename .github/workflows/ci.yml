name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-vst3:
    name: Windows VST3 / Release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache fetched dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/build/windows-x64/_deps
          key: windows-2022-iplug2-d54f69050f517e43b941d88c2a170f0a840b9ee4-vst3-3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64-release

      - name: Test core and DSP laboratory
        run: ctest --preset windows-x64-release

      - name: Produce P2 DSP laboratory evidence
        shell: pwsh
        run: |
          $lab = Get-ChildItem -Path out/build/windows-x64 -Recurse -File -Filter gitasedap_dsp_lab.exe |
            Select-Object -First 1

          if (-not $lab) {
            throw "gitasedap_dsp_lab.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path out/p2-evidence | Out-Null

          & $lab.FullName generate impulse out/p2-evidence/impulse_48k.wav 48000 48000
          if ($LASTEXITCODE -ne 0) { throw "DSP lab impulse generation failed." }

          & $lab.FullName generate sweep out/p2-evidence/sweep_20_20k_48k.wav 48000 48000
          if ($LASTEXITCODE -ne 0) { throw "DSP lab sweep generation failed." }

          & $lab.FullName inspect out/p2-evidence/sweep_20_20k_48k.wav |
            Out-File -Encoding utf8 out/p2-evidence/sweep_inspect.txt
          if ($LASTEXITCODE -ne 0) { throw "DSP lab WAV inspection failed." }

          & $lab.FullName compare out/p2-evidence/sweep_20_20k_48k.wav out/p2-evidence/sweep_20_20k_48k.wav |
            Out-File -Encoding utf8 out/p2-evidence/golden_self_compare.txt
          if ($LASTEXITCODE -ne 0) { throw "DSP lab golden comparison smoke failed." }

          & $lab.FullName benchmark 48000 64 5000 |
            Out-File -Encoding utf8 out/p2-evidence/benchmark_48k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "DSP lab benchmark smoke failed." }

      - name: Produce P3 source-adapter evidence
        shell: pwsh
        run: |
          $lab = Get-ChildItem -Path out/build/windows-x64 -Recurse -File -Filter gitasedap_dsp_lab.exe |
            Select-Object -First 1

          if (-not $lab) {
            throw "gitasedap_dsp_lab.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path out/p3-evidence | Out-Null

          & $lab.FullName source-demo out/p3-evidence/synthetic_quack_input.wav out/p3-evidence/synthetic_quack_processed.wav 48000 |
            Out-File -Encoding utf8 out/p3-evidence/source_demo_metrics.txt
          if ($LASTEXITCODE -ne 0) { throw "P3 synthetic source-adapter demo failed." }

          & $lab.FullName inspect out/p3-evidence/synthetic_quack_processed.wav |
            Out-File -Encoding utf8 out/p3-evidence/processed_inspect.txt
          if ($LASTEXITCODE -ne 0) { throw "P3 processed WAV inspection failed." }

          & $lab.FullName benchmark-source 48000 64 10000 |
            Out-File -Encoding utf8 out/p3-evidence/source_benchmark_48k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P3 48 kHz source benchmark failed." }

          & $lab.FullName benchmark-source 96000 64 10000 |
            Out-File -Encoding utf8 out/p3-evidence/source_benchmark_96k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P3 96 kHz source benchmark failed." }

      - name: Produce P4A hybrid-body evidence
        shell: pwsh
        run: |
          $lab = Get-ChildItem -Path out/build/windows-x64 -Recurse -File -Filter gitasedap_dsp_lab.exe |
            Select-Object -First 1

          if (-not $lab) {
            throw "gitasedap_dsp_lab.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path out/p4a-evidence | Out-Null

          & $lab.FullName body-demo out/p4a-evidence/body_input.wav out/p4a-evidence/body_natural_dev.wav 48000 |
            Out-File -Encoding utf8 out/p4a-evidence/body_demo_metrics.txt
          if ($LASTEXITCODE -ne 0) { throw "P4A body demo failed." }

          & $lab.FullName inspect out/p4a-evidence/body_natural_dev.wav |
            Out-File -Encoding utf8 out/p4a-evidence/body_processed_inspect.txt
          if ($LASTEXITCODE -ne 0) { throw "P4A body WAV inspection failed." }

          & $lab.FullName benchmark-transfer 48000 64 10000 |
            Out-File -Encoding utf8 out/p4a-evidence/transfer_benchmark_48k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P4A transfer benchmark failed." }

          & $lab.FullName benchmark-body 48000 64 10000 |
            Out-File -Encoding utf8 out/p4a-evidence/body_benchmark_48k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P4A 48 kHz body benchmark failed." }

          & $lab.FullName benchmark-body 96000 64 10000 |
            Out-File -Encoding utf8 out/p4a-evidence/body_benchmark_96k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P4A 96 kHz body benchmark failed." }

      - name: Produce P4B profile-switch evidence
        shell: pwsh
        run: |
          $lab = Get-ChildItem -Path out/build/windows-x64 -Recurse -File -Filter gitasedap_dsp_lab.exe |
            Select-Object -First 1

          if (-not $lab) {
            throw "gitasedap_dsp_lab.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path out/p4b-evidence | Out-Null

          & $lab.FullName benchmark-body-switch 48000 64 10000 |
            Out-File -Encoding utf8 out/p4b-evidence/body_switch_benchmark_48k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P4B 48 kHz switch benchmark failed." }

          & $lab.FullName benchmark-body-switch 96000 64 10000 |
            Out-File -Encoding utf8 out/p4b-evidence/body_switch_benchmark_96k_64.txt
          if ($LASTEXITCODE -ne 0) { throw "P4B 96 kHz switch benchmark failed." }

      - name: Produce P4C profile A/B evidence
        shell: pwsh
        run: |
          $lab = Get-ChildItem -Path out/build/windows-x64 -Recurse -File -Filter gitasedap_dsp_lab.exe |
            Select-Object -First 1

          if (-not $lab) {
            throw "gitasedap_dsp_lab.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path out/p4c-evidence | Out-Null

          & $lab.FullName profile-compare out/p4c-evidence/raw_p3.wav out/p4c-evidence/natural_dev.wav out/p4c-evidence/dreadnought_dev.wav 48000 |
            Out-File -Encoding utf8 out/p4c-evidence/profile_compare_metrics.txt
          if ($LASTEXITCODE -ne 0) { throw "P4C profile level-match comparison failed." }

          & $lab.FullName inspect out/p4c-evidence/raw_p3.wav |
            Out-File -Encoding utf8 out/p4c-evidence/raw_inspect.txt
          if ($LASTEXITCODE -ne 0) { throw "P4C Raw/P3 WAV inspection failed." }

          & $lab.FullName inspect out/p4c-evidence/natural_dev.wav |
            Out-File -Encoding utf8 out/p4c-evidence/natural_inspect.txt
          if ($LASTEXITCODE -ne 0) { throw "P4C Natural WAV inspection failed." }

          & $lab.FullName inspect out/p4c-evidence/dreadnought_dev.wav |
            Out-File -Encoding utf8 out/p4c-evidence/dreadnought_inspect.txt
          if ($LASTEXITCODE -ne 0) { throw "P4C Dreadnought WAV inspection failed." }

      - name: Produce P4D calibration-tool evidence
        shell: pwsh
        run: |
          $lab = Get-ChildItem -Path out/build/windows-x64 -Recurse -File -Filter gitasedap_dsp_lab.exe |
            Select-Object -First 1

          if (-not $lab) {
            throw "gitasedap_dsp_lab.exe was not produced."
          }

          New-Item -ItemType Directory -Force -Path out/p4d-evidence | Out-Null

          # Deterministic synthetic smoke material only. This validates the P4D
          # tooling path; it is explicitly not a real-guitar tonal fixture.
          & $lab.FullName generate pink out/p4d-evidence/synthetic_piezo.wav 48000 576000
          if ($LASTEXITCODE -ne 0) { throw "P4D synthetic piezo generation failed." }

          Copy-Item -Force out/p4d-evidence/synthetic_piezo.wav out/p4d-evidence/synthetic_reference.wav

          & $lab.FullName calibrate-pair out/p4d-evidence/synthetic_piezo.wav out/p4d-evidence/synthetic_reference.wav out/p4d-evidence/pair_report.csv |
            Out-File -Encoding utf8 out/p4d-evidence/pair_summary.txt
          if ($LASTEXITCODE -ne 0) { throw "P4D pair calibration smoke failed." }

          & $lab.FullName evaluate-profile out/p4d-evidence/synthetic_piezo.wav out/p4d-evidence/synthetic_reference.wav raw active out/p4d-evidence/raw_processed.wav out/p4d-evidence/raw_report.csv |
            Out-File -Encoding utf8 out/p4d-evidence/raw_summary.txt
          if ($LASTEXITCODE -ne 0) { throw "P4D Raw profile evaluation failed." }

          & $lab.FullName evaluate-profile out/p4d-evidence/synthetic_piezo.wav out/p4d-evidence/synthetic_reference.wav natural active out/p4d-evidence/natural_processed.wav out/p4d-evidence/natural_report.csv |
            Out-File -Encoding utf8 out/p4d-evidence/natural_summary.txt
          if ($LASTEXITCODE -ne 0) { throw "P4D Natural profile evaluation failed." }

          & $lab.FullName evaluate-profile out/p4d-evidence/synthetic_piezo.wav out/p4d-evidence/synthetic_reference.wav dread active out/p4d-evidence/dread_processed.wav out/p4d-evidence/dread_report.csv |
            Out-File -Encoding utf8 out/p4d-evidence/dread_summary.txt
          if ($LASTEXITCODE -ne 0) { throw "P4D Dreadnought profile evaluation failed." }

      - name: Configure official VST3 validator
        shell: pwsh
        run: |
          $sdk = Resolve-Path "out/build/windows-x64/_deps/gitasedap_iplug2-src/Dependencies/IPlug/VST3_SDK"

          cmake `
            -S $sdk `
            -B out/build/vst3-validator `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF `
            -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF

      - name: Build official VST3 validator
        run: cmake --build out/build/vst3-validator --config Release --target validator --parallel 4

      - name: Validate VST3 and lifecycle
        shell: pwsh
        run: |
          $validator = Get-ChildItem -Path out/build/vst3-validator -Recurse -File -Filter validator.exe |
            Select-Object -First 1

          if (-not $validator) {
            throw "Steinberg validator.exe was not produced."
          }

          $plugin = Get-ChildItem -Path out/build/windows-x64 -Recurse -Directory -Filter GitaSedap.vst3 |
            Select-Object -First 1

          if (-not $plugin) {
            throw "GitaSedap.vst3 was not produced by the build."
          }

          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "VST3 validator failed in default instance mode."
          }

          & $validator.FullName "-l" $plugin.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "VST3 validator failed in local-instance lifecycle mode."
          }

      - name: Stage VST3 artifact
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path out/build/windows-x64 -Recurse -Directory -Filter GitaSedap.vst3 |
            Select-Object -First 1

          if (-not $plugin) {
            throw "GitaSedap.vst3 was not produced by the build."
          }

          New-Item -ItemType Directory -Force -Path out/artifact | Out-Null
          Copy-Item -Recurse -Force $plugin.FullName out/artifact/GitaSedap.vst3

      - name: Upload VST3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-Windows-VST3-${{ github.sha }}
          path: out/artifact/GitaSedap.vst3
          if-no-files-found: error
          retention-days: 14

      - name: Upload P2 DSP laboratory evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-P2-DSP-Lab-${{ github.sha }}
          path: out/p2-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload P3 source-adapter evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-P3-Source-Adapter-${{ github.sha }}
          path: out/p3-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload P4A hybrid-body evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-P4A-Hybrid-Body-${{ github.sha }}
          path: out/p4a-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload P4B profile-switch evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-P4B-Profile-Switch-${{ github.sha }}
          path: out/p4b-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload P4C profile A/B evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-P4C-Profile-AB-${{ github.sha }}
          path: out/p4c-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Upload P4D calibration-tool evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GitaSedap-P4D-Calibration-Tools-${{ github.sha }}
          path: out/p4d-evidence
          if-no-files-found: error
          retention-days: 14
